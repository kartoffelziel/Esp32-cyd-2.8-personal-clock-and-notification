name: Build firmware

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài PlatformIO và esptool
        run: pip install platformio esptool==4.8.1

      - name: Build
        run: pio run -e cyd_inv

      - name: Ghép file nạp 0x0 (factory)
        run: |
          set -e
          mkdir -p out
          B=.pio/build/cyd_inv
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -n1)
          python -m esptool --chip esp32 merge_bin \
            -o out/cyd-clock-factory.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 $B/bootloader.bin \
            0x8000 $B/partitions.bin \
            0xe000 "$BOOT_APP0" \
            0x10000 $B/firmware.bin
          cp $B/firmware.bin out/cyd-clock-app.bin
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: cyd-clock-firmware
          path: out/*.bin
